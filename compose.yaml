# development setup
services:
    php:
        restart: unless-stopped
        build:
            context: ./services
            target: php-dev
            args:
                APP_ENV: ${APP_ENV:-dev}
                XDEBUG_ENABLED: ${XDEBUG_ENABLED-false}
        volumes:
            - ./services/php/app:/app:delegated
            - ~/.ssh:/root/_ssh:ro
        environment:
            - PHP_IDE_CONFIG
            - XDEBUG_CONFIG
            - XDEBUG_MODE=develop
            - APP_ENV
            - APP_DEBUG
            - DB_HOST=db
            - DB_NAME
            - DB_USER
            - DB_PASSWORD

    nginx:
        restart: unless-stopped
        build:
            context: ./services
            target: nginx-dev
            args:
                BUILD_ENV: ${APP_ENV:-dev}
        ports:
            - "80:80"
        volumes:
            - ./services/php/app:/app:delegated
        environment:
            - NGINX_PORT
            - RESOLVER_IP
            - UPSTREAM_HOST
            - UPSTREAM_PORT

